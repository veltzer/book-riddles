# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

# ─── the book ────────────────────────────────────────────────────────────────

# src/sk/*.sk are 3D scenes; sketch renders each one to TikZ code under
# out/src/sk/, where riddling.tex \inputs it.
[processor.generator.generic.sketch]
command = "scripts/wrapper_sketch.py"
src_dirs = ["src/sk"]
src_extensions = [".sk"]
output_dir = "out/src/sk"
output_extension = "tex"
batch = false

# riddling.tex is one document assembled from src/include/*.tex and the
# sketch figures, and it lands in docs/ because GitHub Pages serves
# master:/docs. An explicit processor rather than generator.pdflatex: the
# figures do not exist on a cold build, and only input_globs can name another
# processor's outputs (dep_inputs only sees files already on disk), which is
# also what orders sketch before pdflatex.
[processor.explicit.generic.book]
command = "scripts/build_pdf.py"
inputs = ["src/tex/riddling.tex"]
input_globs = ["src/include/*.tex", "out/src/sk/*.tex"]
output_files = ["docs/riddling.pdf"]
required_tools = ["pdflatex"]

# sketch and the TeX Live parts riddling.tex loads: hyperref (latex-base),
# thumbpdf (latex-recommended), datetime (latex-extra), tikz (pictures),
# pst-pdf (pstricks).
[dependencies]
system = [
    "sketch",
    "texlive-latex-base",
    "texlive-latex-recommended",
    "texlive-latex-extra",
    "texlive-pictures",
    "texlive-pstricks",
]

[processor.checker.ruff]
src_dirs = ["src", "scripts", "config"]


[processor.checker.pyrefly]
src_dirs = ["src", "scripts", "config"]

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── perl ────────────────────────────────────────────────────────────────────

[processor.checker.iperlcritic]
src_dirs = ["instances"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# not linted: instances/print_stars (the sources are the riddle text verbatim:
# the unused and shadowed `i` are the puzzle, not a defect to fix)
[processor.checker.cppcheck]
src_dirs = ["instances"]
src_exclude_dirs = ["instances/print_stars"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checker.icheckstyle]
src_dirs = ["instances/path"]

# ─── html ────────────────────────────────────────────────────────────────────

# not linted: docs/web (vendored pdf.js viewer)
[processor.checker.itidy]
src_dirs = ["docs"]
