# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_files = ["package.json"]

# ─── perl ────────────────────────────────────────────────────────────────────

[processor.perlcritic]
src_dirs = ["instances"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# not linted: instances/print_stars (the sources are the riddle text verbatim:
# the unused and shadowed `i` are the puzzle, not a defect to fix)
[processor.cppcheck]
src_dirs = ["instances"]
src_exclude_dirs = ["instances/print_stars"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checkstyle]
src_dirs = ["instances/path"]
args = ["-c", "checkstyle.xml"]

# ─── html ────────────────────────────────────────────────────────────────────

# not linted: docs/web (vendored pdf.js viewer)
[processor.htmlhint]
src_dirs = ["docs"]
